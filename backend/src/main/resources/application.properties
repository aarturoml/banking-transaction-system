spring.application.name=banking-transaction-system
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banking}
spring.datasource.username=${DB_USERNAME:banking}
spring.datasource.password=${DB_PASSWORD:banking}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-me-32-chars}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
